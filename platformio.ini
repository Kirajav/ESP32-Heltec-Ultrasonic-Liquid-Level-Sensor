; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_kit_32]
platform = espressif32@6.3.2
board = heltec_wifi_kit_32
framework = arduino
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs
; upload_port = COM5   ; Descomenta y ajusta si PlatformIO no detecta el puerto
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
lib_ldf_mode = deep+
monitor_log2file = logs/monitor_serial.log
extra_scripts = pre:scripts/minify_web.py

build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D WEBSERIAL_LOG_LEVEL=2
    -D ASYNCWEBSERVER_REGEX=0
    -D ARDUINO_HELTEC_WIFI_KIT_32_V1
    -D WIFI_KIT_32
    -D ASYNC_TCP_SSL_ENABLED=0
    -D USE_LITTLEFS=1
    -D USE_SPIFFS=0
    -D ESP_DRD_USE_LITTLEFS=true
    -D ESP_DRD_USE_EEPROM=false
    -D ESP_DRD_USE_SPIFFS=false
    -D CONFIG_TIMEZONE="America/Mexico_City"
    -D CONFIG_CHARSET_UTF8
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0
    -I lib/Config

lib_deps = 
    heltecautomation/Heltec ESP32 Dev-Boards @ ^2.1.4
    martinsos/HCSR04 @ ^2.0.0
    bblanchon/ArduinoJson @ ^6.21.3
    ayushsharma82/ElegantOTA @ ^3.1.7
    https://github.com/ayushsharma82/WebSerial.git
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/khoih-prog/ESPAsyncDNSServer.git
    khoih-prog/ESP_DoubleResetDetector@^1.3.2
    knolleary/PubSubClient @ ^2.8

lib_ignore = 
    AsyncTCP_SSL
    ESPAsync_WiFiManager_Lite
    WebManager

; ========================================================
; CONFIGURACIÓN DE TESTING
; ========================================================
[env:heltec_test]
platform = espressif32@6.3.2
board = heltec_wifi_kit_32
framework = arduino
test_framework = unity
test_build_src = no
test_filter = test_*
test_ignore = test_web/*
lib_ldf_mode = deep+
monitor_speed = 115200

build_flags = 
    -D UNIT_TEST
    -D UNITY_INCLUDE_DOUBLE
    -D UNITY_DOUBLE_PRECISION=1e-12
    -D ARDUINO_HELTEC_WIFI_KIT_32_V1
    -D WIFI_KIT_32
    -I lib/Config
    -I lib/Config/Domain

lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    heltecautomation/Heltec ESP32 Dev-Boards @ ^2.1.4
    martinsos/HCSR04 @ ^2.0.0

; Para ejecutar tests:
; pio test -e heltec_test                    -> Ejecuta todos los tests en ESP32
; pio test -e heltec_test -f test_config     -> Solo tests de configuración
; pio test -e heltec_test -f test_display    -> Solo tests de display
; pio test -e heltec_test -f test_sensor     -> Solo tests de sensor
; pio test -e heltec_test -v                 -> Verbose (ver detalles)
; pio test -e heltec_test --without-uploading --without-testing  -> Solo compilar
;
; NOTA: Los tests de backend (C++) NECESITAN el ESP32 conectado por USB.
;       Los tests de frontend (test_web/*.html) se abren en el navegador.
